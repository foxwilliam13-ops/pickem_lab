name: Update dashboard

on:
  # Schedule is OFF in pickem_lab (manual runs only) so it never competes with elyse_pickem's
  # runs for the shared free Gemini limit. To turn it on, uncomment these lines (pick a time
  # that doesn't overlap elyse_pickem's 13:07 UTC run).
  # schedule:
  #   - cron: '7 14 * * 4,5'
  workflow_dispatch:        # adds the "Run workflow" button on the Actions tab
  push:
    branches: [main]        # republish the page when you edit it

permissions:
  contents: write           # lets the run save the new data files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50     # hard stop; news.py gives up on its own after 30 minutes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Pull this week's games
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: turns on AI news notes
        run: python scripts/build_data.py

      - name: Save the data files to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sports
          git diff --staged --quiet || git commit -m "Update dashboard data"
          git pull --rebase
          git push

      # Cloudflare copy of the site (pickem-lab.pickempickers.workers.dev). Uses the runner's
      # built-in Node. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Secrets.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --version
          npm ci --no-audit --no-fund
          npx wrangler deploy

      # Leagues database: send this run's plain game feed. A failure here doesn't stop the
      # dashboard from publishing. Needs INGEST_SECRET (same value as the Cloudflare secret).
      - name: Send games to the leagues database
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$INGEST_SECRET" ]; then echo "INGEST_SECRET not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            --data-binary @docs/sports/cfb/feed.json \
            https://pickem-lab.pickempickers.workers.dev/api/ingest

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
